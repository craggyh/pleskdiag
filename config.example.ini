[general]
# Standard Plesk path. Change only for a non-standard installation.
vhost_system_dir = /var/www/vhosts/system
archive_dir = /var/log/pleskdiag

[sampling]
seconds = 10
interval = 2

[apache]
# Plesk commonly proxies to Apache on 7080.
status_url = http://127.0.0.1:7080/pleskdiag-server-status

[publish]
enabled = true
# Existing private Git checkout used by `pleskdiag publish`.
repo_dir = /opt/webcore-diagnostics
